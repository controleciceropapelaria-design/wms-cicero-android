name: APK
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # publicar o APK em "Releases"

jobs:
  apk:
    runs-on: ubuntu-24.04   # fixo: a imagem nova (Ubuntu 26) pode vir sem o Android SDK
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3   # garante o Android SDK e aceita as licenças
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Chave de assinatura
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Faltam os segredos KEYSTORE_B64 e KEYSTORE_PASS (Settings > Secrets and variables > Actions)."
            exit 1
          fi
          echo "$KS_B64" | tr -d ' \r\n' | base64 -d > app/wms.jks
      - name: Compilar APK
        env:
          KS_PASS: ${{ secrets.KEYSTORE_PASS }}
        run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: wms-cicero-apk
          path: app/build/outputs/apk/release/*.apk
          retention-days: 90
      - name: Publicar em Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: WMS Cícero 1.0.${{ github.run_number }}
          body: APK do WMS Cícero para os coletores (Android 8+). Instale por cima da versão anterior.
          files: app/build/outputs/apk/release/*.apk
