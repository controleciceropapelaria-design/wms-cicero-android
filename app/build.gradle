plugins {
    id 'com.android.application'
}

// número da compilação do GitHub vira a versão do app (cada APK novo instala por cima do anterior)
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1').toInteger()

android {
    namespace 'br.com.cicero.wms'
    compileSdk 34

    defaultConfig {
        applicationId 'br.com.cicero.wms'
        minSdk 26          // Android 8 ou mais (coletores)
        targetSdk 34
        versionCode run
        versionName "1.0.${run}"
    }

    signingConfigs {
        release {
            storeFile file('wms.jks')
            storePassword System.getenv('KS_PASS')
            keyAlias 'wms'
            keyPassword System.getenv('KS_PASS')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    // o app é só a "moldura" do WMS: o lint de publicação na Play Store não se aplica (APK instalado direto)
    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    applicationVariants.all { v ->
        v.outputs.all { outputFileName = "wms-cicero-${v.versionName}.apk" }
    }
}
